name: test

on:
  push:
    branches: [main]
  pull_request:

# win-hooks is Windows-only (it exits 0 off-Windows), so the suite only means
# anything on a Windows runner.
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node test/run.mjs
      - run: node scripts/sync-version --check
